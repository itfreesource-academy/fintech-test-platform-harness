version: '3.8'

networks:
  fintech-backend-net:
    driver: bridge

services:
  # 1. Apache Kafka Broker in KRaft Mode (Zookeeper-less)
  kafka-broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fintech-kafka-broker
    networks:
      - fintech-backend-net
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka-broker:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-broker:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

  # 2. Real-Time Kafka Observability UI (AKHQ / Kafka-UI)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: fintech-kafka-ui
    networks:
      - fintech-backend-net
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: 'fintech-cluster'
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: 'kafka-broker:29092'
    depends_on:
      - kafka-broker

  # 3. Standalone WireMock Mock Microservice Gateway
  wiremock:
    image: wiremock/wiremock:3.5.2
    container_name: fintech-wiremock-gateway
    networks:
      - fintech-backend-net
    ports:
      - "8089:8080"
    command: ["--global-response-templating", "--verbose"]

  # 4. Containerized Java 17 Test Runner
  test-runner:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: fintech-java-test-runner
    networks:
      - fintech-backend-net
    environment:
      KAFKA_BOOTSTRAP_SERVERS: "kafka-broker:29092"
      PAYMENT_API_BASE_URL: "http://wiremock:8080"
      CI: "true"
    depends_on:
      - kafka-broker
      - wiremock
