apiVersion: batch/v1
kind: Job
metadata:
  name: fintech-test-harness-job
  namespace: qa-automation
  labels:
    app.kubernetes.io/name: fintech-test-platform
    app.kubernetes.io/part-of: quality-gate
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: fintech-test-runner
    spec:
      restartPolicy: Never
      containers:
        - name: test-runner
          image: defendloop/fintech-test-platform-harness:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
            - name: PAYMENT_API_BASE_URL
              value: "http://payment-service.fintech.svc.cluster.local:8080"
            - name: CI
              value: "true"
          resources:
            requests:
              memory: "1Gi"
              cpu: "1000m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
